name: Lean Action CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune -af || true

          echo "Disk space after cleanup:"
          df -h

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Lean sources for proof placeholders
        shell: bash
        run: |
          if grep -REn --include='*.lean' \
            '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)|(:=|by|exact|refine)[[:space:]]+(sorry|admit)([[:space:]]|$)' \
            EndpointCoordinate EndpointCoordinate.lean; then
            echo "Proof placeholder or project-defined axiom found."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run symbolic audit
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            -r supplement/requirements.txt
          python supplement/moment_expansion_audit.py

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          use-mathlib-cache: true
          use-github-cache: false
